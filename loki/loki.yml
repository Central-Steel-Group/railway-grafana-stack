auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info
  # Increased to stop the 5.002s DeadlineExceeded errors
  http_server_write_timeout: 1m

ingester_client:
  # FIX: Extends the internal 5s watchdog to 15s
  remote_timeout: 15s

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  # Move data to a subfolder to avoid root-level collisions
  path_prefix: /loki/data

ingester:
  flush_on_shutdown: true

schema_config:
  configs:
  - from: 2025-01-01
    index:
      period: 24h
      prefix: index_
    store: tsdb
    object_store: filesystem
    schema: v13

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
